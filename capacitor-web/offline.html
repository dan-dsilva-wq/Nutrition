<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pace</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fbfaf6;
        --ink: #0f1714;
        --muted: #5b6661;
        --forest: #0d9488;
        --forest-2: #0b7c70;
        --hairline: #e7e5e0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px
          calc(env(safe-area-inset-bottom, 0px) + 24px);
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #1f5d50;
        position: relative;
        display: grid;
        place-items: center;
        color: #faf8f5;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 46px;
        line-height: 1;
        box-shadow: 0 12px 30px rgba(31, 93, 80, 0.22);
      }

      .mark::after {
        content: "";
        position: absolute;
        top: 14px;
        right: 14px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f0c66e;
      }

      h1 {
        margin: 28px 0 8px;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 30px;
        line-height: 1.15;
      }

      p {
        margin: 0 auto;
        max-width: 20rem;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      button {
        margin-top: 28px;
        min-width: 200px;
        height: 50px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--forest);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:active {
        background: var(--forest-2);
        transform: scale(0.98);
      }

      button[disabled] {
        opacity: 0.7;
      }

      .hint {
        margin-top: 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">P</div>
    <h1>You're offline</h1>
    <p>
      Pace needs a connection to load your day, analyse meal photos and talk to
      your coach. Your logs are safe on this phone.
    </p>
    <button id="retry" type="button">Try again</button>
    <p class="hint" id="hint">We'll reconnect automatically when you're back online.</p>

    <script>
      // Keep in sync with PRODUCTION_SERVER_URL in capacitor.config.ts.
      var APP_URL = "https://pace-nutrition.vercel.app/";
      var button = document.getElementById("retry");
      var hint = document.getElementById("hint");

      function retry() {
        button.disabled = true;
        button.textContent = "Reconnecting…";
        window.location.replace(APP_URL);
        window.setTimeout(function () {
          button.disabled = false;
          button.textContent = "Try again";
          hint.textContent = "Still no connection. Check Wi-Fi or mobile data.";
        }, 8000);
      }

      button.addEventListener("click", retry);
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
